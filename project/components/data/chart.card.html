<!-- @dsCard group="Components" viewport="700x760" subtitle="Area (position), line with price line (commodity), baseline (LTV), histogram; loading, empty, error states" name="Data · Chart card (TradingView Lightweight Charts v5)" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
<script src="../../_ds_bundle.js" onerror="void 0"></script>
<script src="../_loader.js"></script>
<style>body{margin:0;padding:16px;background:var(--surface)} .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap} .col{display:flex;flex-direction:column;gap:12px} .lbl{font:var(--font-caption-1);color:var(--content-tertiary);min-width:84px;flex:none}</style>
</head><body><div id="root"></div>
<script type="text/babel">
loadDS('../').then((DS) => {
const { Icon, Text, textStyle, Avatar, Logo, Button, PressButton, PressToggle, Capsule, CapsuleGroup, Segmented, LineStepper, StatusMark, ProvenanceChip, ConfirmationChip, Banner, SeverityTag, EmptyState, Skeleton, CardSkeleton, Dialog, SearchField, Tabs, CommodityTabs, SyncStatus, Header, MobileShell, MODULES, QuantityChip, ShareBar, Figure, Card, CardRow, Dot, RailRow, DataTable, RestrictedCell, DerivedCell, RefCell, ChartCard, ChartAttribution, EvidenceTile, Timeline, ActionPanel, AmountRow, SummaryList, RadioList, ReconcilePanel } = DS;
const L=(t)=><span className="lbl">{t}</span>;

function Demo(){
  const days=(n,f)=>Array.from({length:n},(_,i)=>({time:'2026-06-'+String(i+1).padStart(2,'0'),value:f(i)}));
  const pos=React.useMemo(()=>days(24,i=>110+i*0.6+Math.sin(i/2)*2.5),[]);
  const wheat=React.useMemo(()=>days(24,i=>8900+i*12+Math.cos(i/3)*90),[]);
  const ltv=React.useMemo(()=>days(24,i=>18+Math.sin(i/4)*3+i*0.25),[]);
  const hist=React.useMemo(()=>days(24,i=>(i%3?1:-1)*(20+((i*7)%15))).map(d=>({...d,value:Math.abs(d.value),color:d.value>0?'#04af52':'#bfc3ca'})),[]);
  const [retry,setRetry]=React.useState(false);
  return <div className="col" style={{gap:16}}>
    <ChartCard title="Position over the month" ranges={['1M','3M','1Y']} range="1M" series={[{type:'area',color:'#2563EB',name:'Position',format:v=>'K'+Math.round(v)+'M',data:pos}]}/>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
      <ChartCard title="Wheat price" height={200} series={[{type:'line',color:'#7A6937',name:'Wheat',format:v=>Math.round(v).toLocaleString(),data:wheat}]} priceLines={[{price:9150,color:'#7A6937',title:'9,150 sell'}]} markers={[{time:'2026-06-12',text:'Soya spike'}]}/>
      <ChartCard title="Kapiri Estates LTV" height={200} series={[{type:'baseline',baseValue:20,name:'LTV',format:v=>v.toFixed(1)+'%',color:'#df0c10',data:ltv}]} priceLines={[{price:22,color:'#df0c10',title:'22% cap'},{price:20,color:'#a16207',title:'20% line'}]}/>
      <ChartCard title="Daily in and out" height={160} endLabel={false} series={[{type:'histogram',data:hist}]}/>
      <ChartCard title="Loading" height={160} state="loading"/>
      <ChartCard title="Empty" height={160} state="empty"/>
      <ChartCard title="Error" height={160} state="error" retrying={retry} onRetry={()=>{setRetry(true);setTimeout(()=>setRetry(false),1500);}}/>
    </div>
    <ChartAttribution/>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
});
</script></body></html>
