<!-- @dsCard group="Components" viewport="1200x720" subtitle="Signed-in frame: 260px sidebar with grouped modules and the active module's sections, a foot of rail links and the collapse toggle, 56px toolbar with breadcrumb, search, sync, digest and the account menu (identity, items, Sign out). The page column ends with the full bleed ticker row, whose inverted corners meet the frame edges" name="Navigation · App shell" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://unpkg.com/lucide@1.39.0/dist/umd/lucide.min.js"></script>

<script src="../../_ds_bundle.js" onerror="void 0"></script>
<script src="../_loader.js"></script>
<style>html,body{margin:0;background:var(--surface)} #root{min-height:100vh}</style>
</head><body><div id="root"></div>
<script type="text/babel">
loadDS('../').then((DS) => {
const { AppShell, MODULES, MenuRow, RailLink, Text, CardSkeleton, EmptyState, ChartAttribution, Ticker } = DS;

const NAV = [{ items: MODULES.map((m) => m.value === 'trade'
  ? { ...m, count: 3, sections: [{ value: 'board', label: 'Trade Board' }, { value: 'coverage', label: 'Coverage' }, { value: 'approvals', label: 'Approvals', count: 2 }] }
  : m) }];
const LABEL = Object.fromEntries(MODULES.map((m) => [m.value, m.label]));
const SECTION = { board: 'Trade Board', coverage: 'Coverage', approvals: 'Approvals' };

// Fictional figures, like every other card. The ticker sits in the shell's own `ticker` slot: the
// last row of the column, full bleed, so the inverted top corners meet the edges of the frame.
const TICK = [
  { id: 'position', icon: 'gauge', label: 'Your position', value: 'K125M', href: '#' },
  { id: 'margin', icon: 'trending-up', label: 'Blended margin', value: 'K11.8M', tone: 'good', href: '#' },
  { id: 'cover', icon: 'arrow-left-right', label: 'Tonnes short on cover', value: '4,120t', tone: 'attention', href: '#' },
  { id: 'stock', icon: 'warehouse', label: 'Stock held', value: '34,117t', href: '#' },
  { id: 'credit', icon: 'hand-coins', label: 'Credit book out', value: 'K174,840', href: '#' },
  { id: 'exceptions', icon: 'triangle-alert', label: 'Open exceptions', value: '6', tone: 'attention', href: '#' },
];

function Demo({ startCollapsed = false }){
  const [module, setModule] = React.useState('trade');
  const [section, setSection] = React.useState('coverage');
  const [busy, setBusy] = React.useState(false);
  const [collapsed, setCollapsed] = React.useState(startCollapsed);
  const go = (v) => { if (SECTION[v]) setSection(v); else if (LABEL[v]) { setModule(v); setSection(v === 'trade' ? 'board' : undefined); } };
  const crumbs = module === 'trade' ? [LABEL[module], SECTION[section]] : [LABEL[module]];
  return <AppShell nav={NAV} module={module} section={section} onNavigate={go} home="command" breadcrumb={crumbs} sync="live"
    collapsed={collapsed} onCollapsedChange={setCollapsed}
    user={{ initials: 'TM', name: 'T. Mwila', email: 't.mwila@example.com', meta: 'Owner' }}
    menu={<><MenuRow icon="settings" label="Preferences" /><MenuRow icon="eye-off" label="Restricted view preview" /></>}
    signingOut={busy} onSignOut={() => { setBusy(true); setTimeout(() => setBusy(false), 1800); }}
    foot={<><RailLink icon="settings" label="Settings" collapsed={collapsed} /><RailLink icon="circle-help" label="Help" collapsed={collapsed} /></>}
    footer={<ChartAttribution />}
    ticker={<Ticker anchor={{ icon: 'gauge', text: 'As at 12 March, 08:40' }} items={TICK} onItemClick={(item, e) => e.preventDefault()} />}>
    <div style={{ display: 'flex', flexDirection: 'column', gap: 24 }}>
      <Text as="h1" variant="heading-1-condensed">{crumbs[crumbs.length - 1]}</Text>
      <EmptyState />
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: 16 }}>{Array.from({length: 9}).map((_, i) => <CardSkeleton key={i} />)}</div>
    </div>
  </AppShell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
});
</script></body></html>
