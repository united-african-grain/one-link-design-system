<!-- @dsCard group="Components" viewport="1100x720" subtitle="New trade ticket, approval decision (busy), dispute resolution, portal confirm; reconcile outcomes; evidence tiles; timeline" name="Records · Action panels, reconcile, evidence, timeline" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://unpkg.com/lucide@1.39.0/dist/umd/lucide.min.js"></script>

<script src="../../_ds_bundle.js" onerror="void 0"></script>
<script src="../_loader.js"></script>
<style>body{margin:0;padding:16px;background:var(--surface)} .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap} .col{display:flex;flex-direction:column;gap:12px} .lbl{font:var(--font-caption-1);color:var(--content-tertiary);min-width:84px;flex:none} @media (max-width:699px){.g2,.g3{grid-template-columns:minmax(0,1fr)!important}.scroll-x{overflow-x:auto;max-width:100%;scrollbar-width:none}}</style>
</head><body><div id="root"></div>
<script type="text/babel">
loadDS('../').then((DS) => {
const { Icon, Text, textStyle, Avatar, Logo, Button, PressButton, PressToggle, Capsule, CapsuleGroup, Segmented, LineStepper, StatusMark, ProvenanceChip, ConfirmationChip, Banner, SeverityTag, EmptyState, Skeleton, CardSkeleton, Dialog, SearchField, Tabs, CommodityTabs, SyncStatus, Header, MobileShell, MODULES, QuantityChip, ShareBar, Figure, Card, CardRow, Dot, RailRow, DataTable, RestrictedCell, DerivedCell, RefCell, ChartCard, ChartAttribution, EvidenceTile, Timeline, ActionPanel, AmountRow, SummaryList, RadioList, ReconcilePanel } = DS;
const L=(t)=><span className="lbl">{t}</span>;

function Demo(){
  const [side,setSide]=React.useState('Sell'); const [com,setCom]=React.useState('White maize'); const [out,setOut]=React.useState('uphold'); const [cd,setCd]=React.useState('Confirm');
  const cc = com==='Wheat'?'var(--commodity-wheat)':'var(--commodity-maize)';
  return <div className="col" style={{gap:20}}>
    <div className="g3" style={{display:'grid',gridTemplateColumns:'repeat(3, 350px)',gap:16,alignItems:'start'}}>
      <ActionPanel tile="KV" context="Kafue Valley Milling · window closes in 12 days" subject="New trade" tabs={['Sell','Buy']} tab={side} onTab={setSide}>
        <PressToggle options={['White maize','Wheat']} value={com} onChange={setCom} selectedVariant="commodity" commodityColor={cc}/>
        <AmountRow label="Tonnage" value="2,000" unit="MT"/>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}><PressButton kind="quick">+100t</PressButton><PressButton kind="quick">+500t</PressButton><PressButton kind="quick">+1,000t</PressButton></div>
        <SummaryList items={[{label:'Price per MT',value:'6,800'},{label:'Buy per MT',value:'6,600'},{label:'Margin preview',value:'K400,000',strong:true},{label:'Blended after trade',value:<><Icon name="trending-up" size={12} color="var(--content-accent-up)"/>8.4%</>}]}/>
        <PressButton kind="large" variant="commodity" commodityColor={cc} fullWidth>Create trade</PressButton>
      </ActionPanel>
      <ActionPanel tile="SL" context="T-0141 · Crest Milling · Wheat" subject="Decision">
        <SummaryList items={[{label:'Blended margin',value:'K148,500'},{label:'vs 30d blended',value:<><Icon name="trending-down" size={12} color="var(--content-accent-down)"/>3.8%</>},{label:'Terms',value:'pay 7d / receive 30d'}]}/>
        <div className="col" style={{gap:8}}><PressButton kind="large" variant="primary" fullWidth loading>Approve</PressButton><Button variant="outline" fullWidth>Query</Button><Button variant="critical-ghost" fullWidth>Decline</Button></div>
      </ActionPanel>
      <ActionPanel tile="KF" context="GR10000377 · DSP-0219" subject="Resolve dispute">
        <RadioList value={out} onChange={setOut} options={[{value:'uphold',label:'Uphold deduction'},{value:'credit',label:'Credit the difference',hint:'0.32 t · K2,176'},{value:'regrade',label:'Re-grade from retained sample'},{value:'dismiss',label:'Dismiss'}]}/>
        <span style={textStyle('body-4',{tone:'secondary'})}>The retained sample is still inside its 30-day window…</span>
        <PressButton kind="large" variant="primary" fullWidth>Resolve case</PressButton>
      </ActionPanel>
    </div>
    <div className="g2" style={{display:'grid',gridTemplateColumns:'350px 1fr',gap:16,alignItems:'start'}}>
      <ActionPanel context="29 Jun · White maize" subject="Booked weight" success={null}>
        <AmountRow label="Booked" value="28.20" unit="t"/><ProvenanceChip kind="synced" style={{alignSelf:'flex-end'}}/>
        <PressToggle options={['Confirm','Dispute']} value={cd} onChange={setCd} selectedVariant={cd==='Dispute'?'critical':'primary'}/>
        <PressButton kind="large" variant="primary" fullWidth loading>Confirm receipt</PressButton>
      </ActionPanel>
      <div className="col" style={{gap:16}}>
        <div className="g2" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
          <ReconcilePanel outcome="within" evidence={<EvidenceTile caption="slip-gr10000356" time="14:22"/>}/>
          <ReconcilePanel outcome="held" columns={[{label:'Weighed in',value:'28.20',unit:'t',provenance:'synced'},{label:'Deduction',value:'1.20',unit:'t',provenance:'ocr-medium',color:'var(--warning-strong)'},{label:'Applied',value:'27.00',unit:'t',provenance:'typed'}]}/>
        </div>
        <ReconcilePanel outcome="block" columns={[{label:'Gross',value:'34.20',unit:'t',provenance:'synced'},{label:'Tare',value:'36.00',unit:'t',provenance:'typed',color:'var(--error-strong)'},{label:'Net',value:'—',provenance:'typed'}]}/>
      </div>
    </div>
    <div className="row" style={{alignItems:'flex-start',gap:32}}>
      <div className="row">{L('evidence')}<EvidenceTile caption="photo-dsp0219-probe-1" time="19:16"/><EvidenceTile kind="voice" duration="0:47" caption="voice-dsp0219-bemba-47s"/><EvidenceTile kind="receipt" caption="slip-wbt10001605"/></div>
      <div style={{flex:1,maxWidth:420}}><Timeline entries={[{text:'Delivery weighed in at 30.02 t',actor:'bridge',time:'1 Aug 18:02'},{text:'Grading: moisture 13.4% · deduction 0.32 t applied',actor:'P. Zulu',time:'1 Aug 19:16'},{text:'Dispute lodged by Kapiri Farms',actor:'C. Musonda',time:'1 Aug 18:14'},{text:'Deduction reversed — credit 0.32 t',actor:'J. du Mulenga',time:'12 Sep 09:10',compensating:true}]}/></div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
});
</script></body></html>
