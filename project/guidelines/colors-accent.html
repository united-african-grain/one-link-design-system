<!-- @dsCard group="Colors" viewport="700x260" subtitle="Brand blue for links and entry points; up/down for deltas; subtle/strong pairs for banners" name="Accents & semantic pairs" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface);font:var(--font-body-3);color:var(--content-primary)} .sw{display:flex;flex-direction:column;gap:6px;min-width:0} .chip{height:44px;border-radius:var(--radius-2xs)} .n{font:var(--font-caption-1);color:var(--content-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .v{font:var(--font-caption-2);color:var(--content-tertiary);font-variant-numeric:tabular-nums} .g{display:grid;gap:12px} .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap} .lbl{font:var(--font-caption-1);color:var(--content-tertiary);min-width:120px;flex:none} @media (max-width:699px){.g[style*="repeat("]{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))!important}div[style*="grid-template-columns:170px 1fr"],div[style*="grid-template-columns:130px 1fr"]{grid-template-columns:minmax(0,1fr)!important;gap:2px!important}}</style></head><body><div class="g" style="grid-template-columns:repeat(6,1fr)"><div class="sw"><div class="chip" style="background:#2563EB;"></div><div class="n">content-accent-brand</div><div class="v">#2563EB</div></div><div class="sw"><div class="chip" style="background:#007e26;"></div><div class="n">content-accent-up (text)</div><div class="v">#007e26</div></div><div class="sw"><div class="chip" style="background:#df0c10;"></div><div class="n">content-accent-down (text)</div><div class="v">#df0c10</div></div><div class="sw"><div class="chip" style="background:#04af52;"></div><div class="n">accent-up-fill (fills only)</div><div class="v">#04af52</div></div><div class="sw"><div class="chip" style="background:#23272d;"></div><div class="n">buttons-primary</div><div class="v">#23272d</div></div><div class="sw"><div class="chip" style="background:#df0c10;"></div><div class="n">buttons-critical</div><div class="v">#df0c10</div></div></div>
<div class="g" style="grid-template-columns:repeat(4,1fr);margin-top:16px">

<div style="background:#f7fbfe;color:#0135aa;border-radius:var(--radius-md);padding:12px 16px"><b style="font-weight:580">info</b><br><span class="v" style="color:inherit">#f7fbfe / #0135aa</span></div>
<div style="background:#e4ffe9;color:#006118;border-radius:var(--radius-md);padding:12px 16px"><b style="font-weight:580">success</b><br><span class="v" style="color:inherit">#e4ffe9 / #006118</span></div>
<div style="background:#fefce8;color:#a16207;border-radius:var(--radius-md);padding:12px 16px"><b style="font-weight:580">warning</b><br><span class="v" style="color:inherit">#fefce8 / #a16207</span></div>
<div style="background:#fff6f2;color:#bc0000;border-radius:var(--radius-md);padding:12px 16px"><b style="font-weight:580">error</b><br><span class="v" style="color:inherit">#fff6f2 / #bc0000</span></div>
</div></body></html>
