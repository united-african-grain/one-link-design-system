<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface);font:var(--font-body-3);color:var(--content-primary)} .sw{display:flex;flex-direction:column;gap:6px;min-width:0} .chip{height:44px;border-radius:var(--radius-2xs)} .n{font:var(--font-caption-1);color:var(--content-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .v{font:var(--font-caption-2);color:var(--content-tertiary);font-variant-numeric:tabular-nums} .g{display:grid;gap:12px} .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap} .lbl{font:var(--font-caption-1);color:var(--content-tertiary);min-width:120px;flex:none} @media (max-width:699px){.g[style*="repeat("]{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))!important}div[style*="grid-template-columns:170px 1fr"],div[style*="grid-template-columns:130px 1fr"]{grid-template-columns:minmax(0,1fr)!important;gap:2px!important}}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)"><div class="sw"><div class="chip" style="background:#C2410C;color:#fff;display:flex;align-items:center;justify-content:center;font:var(--font-body-3-strong)">5.2:1</div><div style="height:2px;border-radius:2px;background:#C2410C;width:70%"></div><div class="chip" style="height:24px;background:color-mix(in oklab, #C2410C 9%, transparent)"></div><div class="n">White maize</div><div class="v">#C2410C</div></div><div class="sw"><div class="chip" style="background:#7A6937;color:#fff;display:flex;align-items:center;justify-content:center;font:var(--font-body-3-strong)">5.4:1</div><div style="height:2px;border-radius:2px;background:#7A6937;width:70%"></div><div class="chip" style="height:24px;background:color-mix(in oklab, #7A6937 9%, transparent)"></div><div class="n">Wheat (local & import)</div><div class="v">#7A6937</div></div><div class="sw"><div class="chip" style="background:#5A7A1E;color:#fff;display:flex;align-items:center;justify-content:center;font:var(--font-body-3-strong)">5.0:1</div><div style="height:2px;border-radius:2px;background:#5A7A1E;width:70%"></div><div class="chip" style="height:24px;background:color-mix(in oklab, #5A7A1E 9%, transparent)"></div><div class="n">Soya</div><div class="v">#5A7A1E</div></div><div class="sw"><div class="chip" style="background:#8A5A36;color:#fff;display:flex;align-items:center;justify-content:center;font:var(--font-body-3-strong)">5.8:1</div><div style="height:2px;border-radius:2px;background:#8A5A36;width:70%"></div><div class="chip" style="height:24px;background:color-mix(in oklab, #8A5A36 9%, transparent)"></div><div class="n">Soya meal</div><div class="v">#8A5A36</div></div><div class="sw"><div class="chip" style="background:#7A3FB8;color:#fff;display:flex;align-items:center;justify-content:center;font:var(--font-body-3-strong)">6.5:1</div><div style="height:2px;border-radius:2px;background:#7A3FB8;width:70%"></div><div class="chip" style="height:24px;background:color-mix(in oklab, #7A3FB8 9%, transparent)"></div><div class="n">Fertilizer</div><div class="v">#7A3FB8</div></div></div></body></html>
