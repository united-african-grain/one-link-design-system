<!-- @dsCard group="One Link" viewport="1440x900" subtitle="Setup: settings and governance. Setup Home, Settings, Switches, Approval steps, Policy methods, Items to approve" name="Setup (admin workspace)" -->
<!-- @startingPoint section="Screens" subtitle="The Setup view an administrator opens from the user menu, with every state" viewport="1440x900" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>One Link Setup</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://unpkg.com/lucide@1.39.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
<script src="../../_ds_bundle.js" onerror="void 0"></script>
<script src="../../components/_loader.js"></script>
<style>html,body{margin:0;background:var(--surface)}#root{min-height:100vh}</style>
</head><body><div id="root"></div>
<script type="text/babel">
loadKit('../../components/', './', ['../one_link/Shell.jsx','Shell.jsx','Settings.jsx','People.jsx','Records.jsx','Data.jsx']).then((K) => {
  const { SetupFrame, Segmented, ScrollRow } = K;
  const STATES = { ...K.SETTINGS_STATES, ...K.PEOPLE_STATES, ...K.RECORDS_STATES, ...K.DATA_STATES };
  // Each Setup navigation item opens its screens; a record's screens sit beside its list.
  const SECTIONS = {
    home: { crumbs: [], screens: ['SetupHome'] },
    settings: { crumbs: ['Settings'], screens: ['SettingsList', 'SettingRecord', 'ScopedValues'] },
    switches: { crumbs: ['Switches'], screens: ['SwitchesList', 'SwitchRecord'] },
    steps: { crumbs: ['Approval steps'], screens: ['ApprovalStepsList', 'ApprovalStepRecord'] },
    policies: { crumbs: ['Policy methods'], screens: ['PolicyMethodsList', 'PolicyRecord'] },
    figures: { crumbs: ['Figures and price tiers'], screens: ['FiguresList', 'FigureRecord'] },
    users: { crumbs: ['Users'], screens: ['UsersList', 'NewUser', 'UserRecord'] },
    bundles: { crumbs: ['Bundles'], screens: ['BundlesList', 'BundleRecord'] },
    audit: { crumbs: ['Audit logs'], screens: ['AccessLog', 'BusinessChanges'] },
    sites: { crumbs: ['Sites and storage units'], screens: ['SitesList', 'SiteRecord'] },
    corridors: { crumbs: ['Corridors and routes'], screens: ['CorridorsList'] },
    products: { crumbs: ['Products'], screens: ['ProductsList'] },
    points: { crumbs: ['Delivery points'], screens: ['DeliveryPointsList'] },
    calendars: { crumbs: ['Operating calendars'], screens: ['OperatingCalendar'] },
    lists: { crumbs: ['Classes, grades and seasons'], screens: ['ReferenceList'] },
    templates: { crumbs: ['Templates'], screens: ['TemplatesList', 'TemplateBuilder', 'NewTemplate', 'TemplateVersion', 'TemplateCompare'] },
    uploads: { crumbs: ['Upload history'], screens: ['UploadHistory', 'UploadRecord', 'UploadPreview', 'NameResolve'] },
    readiness: { crumbs: ['Production readiness'], screens: ['ProductionReadiness'] },
    review: { crumbs: ['Access review'], screens: ['AccessReview'] },
  };
  const OUTSIDE = ['UserMenuWithSetup', 'ItemsToApprove', 'SignIn', 'Activate', 'CounterpartiesList', 'CounterpartyRecord', 'LedgerView', 'ContractView'];
  const LABEL = { SetupHome: 'Setup Home', SettingsList: 'List', SettingRecord: 'Record', ScopedValues: 'Scoped values', SwitchesList: 'List', SwitchRecord: 'Record', ApprovalStepsList: 'List', ApprovalStepRecord: 'Record', PolicyMethodsList: 'List', PolicyRecord: 'Record', UserMenuWithSetup: 'User menu with Setup', ItemsToApprove: 'Items to approve', SignIn: 'Sign in', Activate: 'Activate', UsersList: 'List', NewUser: 'New user', UserRecord: 'Record', BundlesList: 'List', BundleRecord: 'Record', FiguresList: 'List', FigureRecord: 'Record', AccessLog: 'Access log', AccessReview: 'Access review', BusinessChanges: 'Business changes', SitesList: 'List', SiteRecord: 'Record', CorridorsList: 'List', ProductsList: 'List', DeliveryPointsList: 'List', OperatingCalendar: 'Calendar', ReferenceList: 'List', TemplateBuilder: 'Template', TemplatesList: 'List', NewTemplate: 'New template', TemplateVersion: 'Version editor', TemplateCompare: 'Compare versions', UploadHistory: 'List', UploadRecord: 'Upload', ProductionReadiness: 'Production readiness', UploadPreview: 'Import preview', NameResolve: 'Name resolve', CounterpartiesList: 'Counterparties', CounterpartyRecord: 'Counterparty', LedgerView: 'Ledger', ContractView: 'Contract' };
  const params = new URLSearchParams(location.search);
  const sectionOf = (screen) => Object.keys(SECTIONS).find((k) => SECTIONS[k].screens.includes(screen));

  function App(){
    const [screen,setScreen]=React.useState(params.get('screen') || 'SetupHome');
    const [state,setState]=React.useState(params.get('state') || (STATES[params.get('screen') || 'SetupHome'] || [])[0]);
    const go=(s,st)=>{ setScreen(s); setState(st || STATES[s][0]); };
    const Screen=K[screen];
    const states=STATES[screen] || [];
    const controls=<ScrollRow align="flex-end" style={{marginBottom:16}}>
      <Segmented options={[...(sectionOf(screen)? SECTIONS[sectionOf(screen)].screens : [screen]).map((s)=>LABEL[s]), ...OUTSIDE.filter((s)=>s!==screen).map((s)=>LABEL[s])]} value={LABEL[screen]}
        onChange={(l)=>go(Object.keys(LABEL).find((k)=>LABEL[k]===l && (OUTSIDE.includes(k) || SECTIONS[sectionOf(screen)||'home'].screens.includes(k))) || 'SetupHome')}/>
      {states.length>1?<Segmented options={states} value={state} onChange={setState}/>:null}
    </ScrollRow>;
    if(OUTSIDE.includes(screen)){
      const openOutside = { CounterpartiesList: 'CounterpartyRecord', LedgerView: 'LedgerView' }[screen];
      const body = <Screen state={state} onSetup={()=>go('SetupHome')} onOpen={openOutside ? (()=>go(openOutside, openOutside==='LedgerView' ? 'Posted entry' : undefined)) : undefined}/>;
      // Counterparties draw outside Setup but inside One Link's own frame.
      const framed = screen==='CounterpartiesList' || screen==='CounterpartyRecord' ? <K.Page module="trade" breadcrumb={['Trade Desk','Counterparties', ...(screen==='CounterpartyRecord'?['Lakeview Farms Ltd']:[])]}>{body}</K.Page> : body;
      return <div><div style={{position:'fixed',right:16,bottom:16,zIndex:60,maxWidth:'calc(100vw - 32px)'}}>{controls}</div>{framed}</div>;
    }
    const section=sectionOf(screen);
    const open=(s)=> (st)=> go(s);
    const record={ SettingsList:'SettingRecord', SwitchesList:'SwitchRecord', ApprovalStepsList:'ApprovalStepRecord', PolicyMethodsList:'PolicyRecord', UsersList:'UserRecord', BundlesList:'BundleRecord', SitesList:'SiteRecord', FiguresList:'FigureRecord', TemplatesList:'TemplateBuilder', UploadHistory:'UploadRecord' }[screen];
    const crumbs=[...SECTIONS[section].crumbs, ...(screen.endsWith('Record')||screen==='ScopedValues'||screen==='NewUser'||K.recordsTitle(screen, state)||K.dataTitle(screen, state)?[K.recordTitle(screen, state) || K.peopleTitle(screen, state) || K.recordsTitle(screen, state) || K.dataTitle(screen, state)]:[])];
    const shipped = screen==='SetupHome' && state==='Before reference data' ? ['home','users','bundles','settings','switches','steps','policies','audit'] : undefined;
    return <SetupFrame section={section} crumbs={crumbs} shipped={shipped} onExit={()=>go('UserMenuWithSetup')}
      onSection={(v)=>{ if(SECTIONS[v]) go(SECTIONS[v].screens[0]); }}>
      <>{controls}<Screen state={state} onOpen={record?open(record):undefined} onSection={(v)=>{ if(SECTIONS[v]) go(SECTIONS[v].screens[0]); }}/></>
    </SetupFrame>;
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
});
</script></body></html>
