<!-- @dsCard group="One Link" viewport="1440x900" subtitle="Interactive click-through: the Managing Director's Home, reports and Assistant; Trade Desk, Warehouse, Stock, Farmer Finance; the Clerk's inbound, outbound and stock control screens; transport planning" name="One Link desktop app" -->
<!-- @startingPoint section="Screens" subtitle="One Link desktop app shell with all owner screens" viewport="1440x900" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>One Link</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://unpkg.com/lucide@1.39.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
<script src="../../_ds_bundle.js" onerror="void 0"></script>
<script src="../../components/_loader.js"></script>
<style>html,body{margin:0;background:var(--surface)}#root{min-height:100vh}</style>
</head><body><div id="root"></div>
<script type="text/babel">
loadKit('../../components/', './', ['Shell.jsx','Home.jsx','Reports.jsx','TradeBoard.jsx','Coverage.jsx','Approval.jsx','Weighbridge.jsx','StockBoard.jsx','CreditBook.jsx','Tickets.jsx','Exceptions.jsx','Counterparties.jsx','Inbound.jsx','StockControl.jsx','GatePrice.jsx','Outbound.jsx','Transport.jsx','../admin_workspace/Shell.jsx','../admin_workspace/CaptureReview.jsx']).then((K) => {
  const { Page, TradeBoard, Coverage, Approval, Weighbridge, GRNFinalise, GradingDispute, StockBoard, CreditBook, Segmented, ScrollRow } = K;
  // The weighbridge continuity screens (M2.DS.01) open in the Clerk's frame, or the owner's for his Exceptions view.
  // Every state opens directly with ?screen=<Screen>&state=<State>, which the screenshot review uses at 1440 and 390.
  // The inbound, gate price and stock screens (M4.DS.01) open in the Clerk's, the owner's or stock control's frame.
  // Stock control decides Captures in review (M4.DS.03) in the same frame; the administrator reads them in Setup.
  // The outbound screens (M4.DS.02) open in the Clerk's, stock control's (Ryan), Trading's (Jacques) or Transport's (Ashraf) frame.
  const M4_STATES = { ...K.INBOUND_STATES, ...K.STOCK_CONTROL_STATES, ...K.GATE_PRICE_STATES, ...K.CAPTURE_DECISION_STATES, ...K.OUTBOUND_STATES, ...K.TRANSPORT_STATES };
  // The Managing Director's Home, records, reports, daily summary and Assistant (M5.DS.01) open in Owen's frame; Home
  // replaced the Command Center screen at source, and the kit opens on it.
  const M5_STATES = { ...K.HOME_STATES, ...K.REPORTS_STATES };
  const STATES = { ...M5_STATES, ...K.TICKETS_STATES, ...K.EXCEPTIONS_STATES, ...K.COUNTERPARTIES_STATES, ...M4_STATES };
  const LABEL = { Home: 'Home', ItemsToApproveList: 'Items to approve', OwnerExceptions: 'Exceptions, Managing Director', OwnerException: 'Exception EXC-000184',
    ReportsList: 'Reports', EndOfDayReport: 'End-of-day report', ExposureReport: 'Exposure by commodity', DailySummary: 'Daily summary email', AssistantPage: 'Assistant',
    ClerkHome: 'Clerk Home', TicketsList: 'Weighbridge tickets', ScannedSlip: 'Scanned slip', TicketRecord: 'Ticket record', FeedHealth: 'Feed health', ExceptionsList: 'Exceptions', ExceptionRecord: 'Exception record', CounterpartyFind: 'Find a counterparty', CounterpartyView: 'Counterparty', CounterpartyGroup: 'Group',
    NewGoodsReceivedNote: 'New goods received note', GoodsReceivedNote: 'Goods received note', LoadOnHold: 'Load on hold', OverDeliveryNotice: 'Over-delivery notice', WarehouseStock: 'Warehouse stock',
    StockPosition: 'Stock position', OnTheRoad: 'On the road', TransferOrder: 'Transfer order', StockTake: 'Stock take', GatePrices: 'Gate prices', NewGatePrice: 'New gate price', GatePriceRecord: 'Gate price', CapturesToReview: 'Captures in review', CaptureDecision: 'Capture',
    ClerkOutbound: 'Clerk Home, Outbound', NewLoadingOrder: 'New loading order', LoadingOrder: 'Loading order', NewDeliveryNote: 'New delivery note', DeliveryNote: 'Delivery note', DeliveryNotes: 'Delivery notes', DirectDelivery: 'Direct delivery',
    TransportHome: 'Transport Home', LoadsNeedTruck: 'Loading orders, Transport', TransportPlanning: 'Transport planning', Transporters: 'Transporters and trucks', TransportersUpload: 'Transporters upload' };
  const m4Frame = (screen, state) => K.OUTBOUND_STATES[screen] ? K.outboundFrame(screen, state) : K.TRANSPORT_STATES[screen] ? K.transportFrame(screen, state) : K.INBOUND_STATES[screen] ? K.inboundFrame(screen, state) : K.STOCK_CONTROL_STATES[screen] ? K.stockControlFrame(screen, state) : K.CAPTURE_DECISION_STATES[screen] ? K.captureDecisionFrame(screen, state) : K.gatePriceFrame(screen, state);
  const params = new URLSearchParams(location.search);
  function Continuity({ initial, onLeave }){
    const [screen,setScreen]=React.useState(initial);
    const [state,setState]=React.useState(params.get('screen')===initial && params.get('state') || STATES[initial][0]);
    const go=(s,st)=>{ setScreen(s); setState(st || STATES[s][0]); };
    const Screen=K[screen];
    const frame = K.HOME_STATES[screen] ? K.homeFrame(screen, state) : K.REPORTS_STATES[screen] ? K.reportsFrame(screen, state) : K.TICKETS_STATES[screen] ? K.ticketsFrame(screen, state) : K.EXCEPTIONS_STATES[screen] ? K.exceptionsFrame(screen, state) : M4_STATES[screen] ? m4Frame(screen, state) : K.counterpartiesFrame(screen, state);
    const controls=<ScrollRow align="flex-end" style={{marginBottom:16}}>
      <Segmented options={['Owner screens', ...Object.keys(STATES).map((s)=>LABEL[s])]} value={LABEL[screen]} onChange={(l)=> l==='Owner screens' ? onLeave() : go(Object.keys(LABEL).find((k)=>LABEL[k]===l))}/>
      {STATES[screen].length>1?<Segmented options={STATES[screen]} value={state} onChange={setState}/>:null}
    </ScrollRow>;
    const GRN_STATE = { GRN10000375: 'Returned', GRN10000377: 'On hold', GRN10000379: 'Weight dispute', GRN10000380: 'Booked' };
    const LO_STATE = { 'LO-2231': 'Committed', 'LO-2236': 'Close short', 'LO-2243': 'Awaiting truck', 'LO-2241': 'Awaiting truck', 'LO-2242': 'Awaiting truck' };
    const DN_STATE = { 'DN-0875': 'Proof missing', 'DN-0883': 'In review', 'DN-0884': 'Variance flagged, clerk', 'DN-0885': 'Pending sync', 'DN-0886': 'Delivery refused', 'DN-0889': 'Bag count mismatch', 'DN-0890': 'Grain, over legal payload' };
    const open=(ref)=> ref==='outbound' ? go('ClerkOutbound') : ref==='inbound' ? go('ClerkHome') : ref==='planning' ? go('TransportPlanning') : ref==='loading' ? go('LoadsNeedTruck')
      : String(ref).startsWith('LO-') || String(ref).startsWith('TR-') ? go('LoadingOrder', LO_STATE[ref] || 'Ready to load')
      : ref==='DN-0889' || ref==='DN-0890' ? go('NewDeliveryNote', DN_STATE[ref]) : String(ref).startsWith('DN-') ? go('DeliveryNote', DN_STATE[ref] || 'Ready to dispatch')
      : ref==='riverbend' ? go('CounterpartyView') : String(ref).startsWith('EXC') ? go('ExceptionRecord')
      : GRN_STATE[ref] ? go('GoodsReceivedNote', GRN_STATE[ref]) : String(ref).startsWith('LEG') ? go('TransferOrder', ref==='LEG-5088' ? 'Past clearing window' : 'In transit')
      : String(ref).startsWith('c3') ? go('CaptureDecision', ref==='c317' ? 'Late capture' : 'From a revoked phone') : String(ref).startsWith('g') ? go('GatePriceRecord') : go('TicketRecord', ref==='WBT10001606' ? 'Ready' : ref==='WBT10001599' ? 'Closed' : 'From scanned slip');
    // Owen's screens open one another: a tile's or row's record, View all, View report, a report by its name.
    const mdOpen=(ref)=> ref==='approvals' ? go('ItemsToApproveList') : ref==='exceptions' ? go('OwnerExceptions') : ref==='exposure' ? go('ExposureReport') : ref==='eod' ? go('EndOfDayReport')
      : ref==='EXC-000184' ? go('OwnerException') : ref==='riverbend' ? go('CounterpartyView') : null;
    const body=<Screen state={state} onOpen={M5_STATES[screen] ? mdOpen : open}/>;
    if(frame.who==='email') return <div><div style={{position:'fixed',right:16,bottom:16,zIndex:60,maxWidth:'calc(100vw - 32px)'}}>{controls}</div>{body}</div>;
    if(frame.who==='md') return <K.MdFrame module={frame.module} breadcrumb={frame.breadcrumb}
      onNavigate={(v)=>{ if(v==='home') go('Home'); if(v==='reports') go('ReportsList'); if(v==='assistant') go('AssistantPage'); if(v==='counterparties') go('CounterpartyFind','List view'); }}>{controls}{body}</K.MdFrame>;
    // Owen's Counterparties module (M3.DS.01) opens in his frame, with Counterparties in the navigation.
    // Stock control's frame (canvas S15), and the owner's or a trader's frame for the decisions and gate prices.
    if(frame.who==='stock') return <Page nav={K.STOCK_NAV} module={frame.module} section={frame.section} breadcrumb={frame.breadcrumb} user={K.STOCK_USER} sync={null}
      onModule={(v)=>{ if(v==='home') go('StockPosition'); }} onSection={(v)=>{ if(v==='road') go('OnTheRoad'); if(v==='transfers') go('TransferOrder'); if(v==='stocktake') go('StockTake'); if(v==='review') go('CapturesToReview');
        if(v==='loading') go('NewLoadingOrder'); if(v==='delivery') go('DeliveryNotes'); if(v==='direct') go('DirectDelivery'); }}>{controls}{body}</Page>;
    // Jacques's frame for grain loading orders (S47 JQ5) and Trading's view of a note; Ashraf's for transport (S59).
    if(frame.who==='jacques') return <Page nav={K.TRADING_NAV} module={frame.module} section={frame.section} breadcrumb={frame.breadcrumb} user={K.TRADING_USER} sync={null}
      onSection={(v)=>{ if(v==='loading') go('NewLoadingOrder','Grain'); if(v==='delivery') go('DeliveryNote','Trading view'); }}>{controls}{body}</Page>;
    if(frame.who==='transport') return <Page nav={K.TRANSPORT_NAV} module={frame.module} section={frame.section} breadcrumb={frame.breadcrumb} user={K.TRANSPORT_USER} sync={null}
      onModule={(v)=>{ if(v==='home') go('TransportHome'); }} onSection={(v)=>{ if(v==='planning') go('TransportPlanning'); if(v==='loading') go('LoadsNeedTruck'); if(v==='transporters') go('Transporters'); }}>{controls}{body}</Page>;
    if(frame.who==='owner' || frame.who==='trading') return <Page nav={K.OWEN_NAV} module={frame.module} breadcrumb={frame.breadcrumb} sync={null}
      user={frame.who==='trading' ? { initials: 'JT', name: 'J. Tembo', meta: 'Trading' } : K.OWEN}>{controls}{body}</Page>;
    if(frame.module==='counterparties') return <Page nav={K.OWEN_NAV} module="counterparties" breadcrumb={frame.breadcrumb} user={K.OWEN} sync={null}>{controls}{body}</Page>;
    if(frame.owner) return <Page module={frame.module} breadcrumb={frame.breadcrumb} sync={null}>{controls}{body}</Page>;
    return <Page nav={K.CLERK_NAV} module={frame.module} section={frame.section} breadcrumb={frame.breadcrumb} user={K.CLERK} sync={null}
      onModule={(v)=>{ if(v==='home') go('ClerkHome'); if(v==='inventory') go('WarehouseStock'); }} onSection={(v)=>{ if(v==='tickets') go('TicketsList'); if(v==='received') go('NewGoodsReceivedNote'); if(v==='loading') go('LoadingOrder','Ready to load'); if(v==='delivery') go('NewDeliveryNote'); }}>{controls}{body}</Page>;
  }
  function App(){
    const [continuity,setContinuity]=React.useState(STATES[params.get('screen')] ? params.get('screen') : 'Home');
    const [module,setModule]=React.useState('trade');
    const [tbState,setTbState]=React.useState('default');
    const [whView,setWhView]=React.useState('Tickets');
    const [tdView,setTdView]=React.useState('Trade Board');
    const [stockView,setStockView]=React.useState('Owner');
    const sync = module==='warehouse' && whView==='Sync silent' ? 'stalled' : 'live';
    if(continuity) return <Continuity initial={continuity} onLeave={()=>{ setModule('trade'); setContinuity(null); }}/>;
    let body=null, controls=null;
    // The Command Center screen is replaced by the Managing Director's Home (M5.DS.01): its module opens Home.
    if(module==='command'){ setContinuity('Home'); return null; }
    if(module==='trade'){ controls=<><Segmented options={['Trade Board','Coverage','Approval','Counterparties','Gate prices']} value={tdView} onChange={(v)=> v==='Counterparties' ? setContinuity('CounterpartyFind') : v==='Gate prices' ? setContinuity('GatePrices') : setTdView(v)}/>{tdView==='Trade Board'?<Segmented options={['Owner','Restricted','Loading']} value={tbState==='default'?'Owner':tbState==='restricted'?'Restricted':'Loading'} onChange={v=>setTbState(v==='Owner'?'default':v.toLowerCase())}/>:null}</>;
      body = tdView==='Trade Board' ? <TradeBoard state={tbState}/> : tdView==='Coverage' ? <Coverage/> : <Approval/>; }
    else if(module==='warehouse'){ controls=<Segmented options={['Tickets','Sync silent','Empty','GRN finalise','Dispute','Clerk screens','Outbound screens','Transport screens']} value={whView} onChange={(v)=> v==='Clerk screens' ? setContinuity('ClerkHome') : v==='Outbound screens' ? setContinuity('ClerkOutbound') : v==='Transport screens' ? setContinuity('TransportHome') : setWhView(v)}/>;
      body = whView==='GRN finalise' ? <GRNFinalise/> : whView==='Dispute' ? <GradingDispute/> : <Weighbridge state={whView==='Sync silent'?'silent':whView==='Empty'?'empty':'default'}/>; }
    else if(module==='stock'){ controls=<Segmented options={['Owner','Stock Control','Stock control screens']} value={stockView} onChange={(v)=> v==='Stock control screens' ? setContinuity('StockPosition') : setStockView(v)}/>; body=<StockBoard role={stockView}/>; }
    else if(module==='finance'){ body=<CreditBook/>; }
    else { body=<div style={{padding:'80px 0',textAlign:'center',color:'var(--content-tertiary)'}}>Ask AI is out of scope for this kit.</div>; }
    return <Page module={module} onModule={setModule} sync={sync} syncLabel={sync==='stalled'?'Bridge feed silent · last batch 3h 12m ago':undefined}>
      {controls?<ScrollRow align="flex-end" style={{marginBottom:16}}>{controls}</ScrollRow>:null}
      {body}
    </Page>;
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
});
</script></body></html>
