<!-- @dsCard group="One Link" viewport="390x844" subtitle="390px artboards of every screen inside the mobile shell" name="One Link mobile app" -->
<!-- @startingPoint section="Screens" subtitle="One Link mobile shell with every screen at 390" viewport="390x844" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>One Link mobile</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://unpkg.com/lucide@1.39.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
<script src="../../_ds_bundle.js" onerror="void 0"></script>
<script src="../../components/_loader.js"></script>
<style>html,body{margin:0;background:var(--grouped)}#root{display:flex;justify-content:center}@media (max-width:480px){.phone{margin:0!important;border-radius:0!important}}</style>
</head><body><div id="root"></div>
<script type="text/babel">
loadKit('../../components/', '../one_link/', ['Shell.jsx','Home.jsx','TradeBoard.jsx','Coverage.jsx','Approval.jsx','Weighbridge.jsx','StockBoard.jsx','CreditBook.jsx']).then((K) => {
  const { MobileShell, MODULES, TradeBoard, Coverage, Approval, Weighbridge, GradingDispute, StockBoard, CreditBook, SyncStatus } = K;
  const SCREENS = {
    // The Command Center screen is replaced by the Managing Director's Home (M5.DS.01). His own phone screens are in
    // the UAG One Link app kit (field_app, S08 J11); this is Home's web page at 390.
    command: { title: 'Home', tabs: null, render: () => <K.Home mobile/> },
    trade: { title: 'Trade Desk', tabs: ['Trade Board','Coverage','Approvals'], render: (t) => t==='Coverage' ? <Coverage mobile/> : t==='Approvals' ? <Approval mobile/> : <TradeBoard mobile/> },
    warehouse: { title: 'Warehouse', tabs: ['Tickets','Disputes'], render: (t) => t==='Disputes' ? <GradingDispute mobile/> : <Weighbridge mobile/> },
    stock: { title: 'Stock', tabs: ['Board','Counts'], render: () => <StockBoard mobile/> },
    finance: { title: 'Farmer Finance', tabs: ['Credit book','Alerts'], render: () => <CreditBook mobile/> },
  };
  function App(){
    const [m,setM]=React.useState('command');
    const [t,setT]=React.useState(null);
    const s=SCREENS[m];
    return <div className="phone" style={{boxShadow:'var(--shadow-dialog)',margin:'24px 0',borderRadius:24,overflow:'hidden',maxWidth:'100%'}}>
      <MobileShell title={s.tabs ? undefined : s.title} modules={MODULES.slice(0,5).map((x)=>x.value==='command'?{...x,label:'Home',icon:'house'}:x)} subTabs={s.tabs || undefined} subTab={t} onSubTabChange={setT} module={m} onModuleChange={(v)=>{ if(!SCREENS[v]) return; setM(v); setT(SCREENS[v].tabs ? SCREENS[v].tabs[0] : null); }} right={m==='command' ? null : <SyncStatus state="live" label="live · 2m"/>}>
        {s.render(t)}
      </MobileShell>
    </div>;
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
});
</script></body></html>
